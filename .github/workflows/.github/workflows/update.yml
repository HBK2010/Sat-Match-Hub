name: Update Matches Data

on:
  schedule:
    # يعمل تلقائياً كل 4 ساعات
    - cron: '0 */4 * * *'
  # يتيح لك تشغيله يدوياً بضغطة زر
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install beautifulsoup4 requests

      - name: Execute Scraper
        run: python scraper.py

      - name: Save and Commit
        run: |
          git config --global user.name "GitHub-Action"
          git config --global user.email "action@github.com"
          git add matches.json
          git diff --staged --quiet || (git commit -m "Auto update matches" && git push)
